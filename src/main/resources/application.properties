spring.application.name=vehicle-inspector
server.port=8080

# PostgreSQL bağlantısı
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle_inspector
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=86400000

# File upload
application.storage.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

application.ai-service.base-url=http://localhost:8000

application.gemini.api-key=${GEMINI_API_KEY}
application.gemini.model=gemini-3.6-flash

application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

application.http.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:5}
application.http.read-timeout-seconds=${HTTP_READ_TIMEOUT_SECONDS:60}

application.google.places.api-key=${GOOGLE_PLACES_API_KEY}
application.google.places.base-url=https://places.googleapis.com

# RevenueCat / Apple App Store / Google Play billing
application.billing.revenuecat.base-url=${REVENUECAT_BASE_URL:https://api.revenuecat.com/v1}
application.billing.revenuecat.secret-api-key=${REVENUECAT_SECRET_API_KEY:}
application.billing.revenuecat.webhook-authorization=${REVENUECAT_WEBHOOK_AUTHORIZATION:}
application.billing.revenuecat.webhook-signing-secret=${REVENUECAT_WEBHOOK_SIGNING_SECRET:}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.localhost=localhost

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Geçici SMTP debug
spring.mail.properties.mail.debug=true
