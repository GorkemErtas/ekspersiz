spring.application.name=vehicle-inspector
server.port=${PORT:8080}

# PostgreSQL bağlantısı
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vehicle_inspector}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# JWT
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=86400000

# File upload
application.storage.upload-dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

application.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
# Configure the same random key on both services before deploying AI enforcement.
application.ai-service.api-key=${AI_SERVICE_API_KEY:}
application.ai-assistant.usage-zone=${AI_ASSISTANT_USAGE_ZONE:Europe/Istanbul}
application.ai-assistant.reservation-ttl=${AI_ASSISTANT_RESERVATION_TTL:PT5M}
# Output ceilings include model thinking; normal answer length is guided by the prompt.
application.ai-assistant.max-output-tokens=${AI_ASSISTANT_MAX_OUTPUT_TOKENS:4096}
application.ai-assistant.retry-max-output-tokens=${AI_ASSISTANT_RETRY_MAX_OUTPUT_TOKENS:8192}

application.gemini.api-key=${GEMINI_API_KEY}
application.gemini.model=gemini-3.6-flash
# Optional grounded price lookup; disable to restore the one-call baseline.
application.pricing.web-search.enabled=${PRICE_WEB_SEARCH_ENABLED:true}

application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

application.http.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:5}
application.http.read-timeout-seconds=${HTTP_READ_TIMEOUT_SECONDS:60}

application.google.places.api-key=${GOOGLE_PLACES_API_KEY}
application.google.places.base-url=https://places.googleapis.com

# In-app reminders and optional Firebase Cloud Messaging delivery
application.notifications.schedule-cron=${NOTIFICATION_SCHEDULE_CRON:0 0 9 * * *}
application.notifications.time-zone=${NOTIFICATION_TIME_ZONE:Europe/Istanbul}
application.notifications.fcm.enabled=${FCM_ENABLED:false}
# Shared secret for the external Railway cron trigger (never commit its value).
application.notifications.job-token=${REMINDER_JOB_TOKEN:}
application.notifications.fcm.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
application.notifications.fcm.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# RevenueCat / Apple App Store / Google Play billing
# No global sandbox bypass. Only explicitly authorized personal credit testers.
application.billing.sandbox-customer-ids=${BILLING_SANDBOX_CUSTOMER_IDS:}
application.billing.revenuecat.base-url=${REVENUECAT_BASE_URL:https://api.revenuecat.com/v1}
application.billing.revenuecat.secret-api-key=${REVENUECAT_SECRET_API_KEY:}
application.billing.revenuecat.webhook-authorization=${REVENUECAT_WEBHOOK_AUTHORIZATION:}
application.billing.revenuecat.webhook-signing-secret=${REVENUECAT_WEBHOOK_SIGNING_SECRET:}

# Transactional email
application.email.brevo.api-key=${BREVO_API_KEY}
application.email.sender-email=${BREVO_SENDER_EMAIL}
application.email.sender-name=${BREVO_SENDER_NAME:EksperSiz}

application.google.auth.client-id=${GOOGLE_AUTH_CLIENT_ID}

# Mobile app version policy
application.mobile.minimum-android-build=${MINIMUM_ANDROID_BUILD:1}

# Explicit release gate; the AI bundle must also have reviewed approval.
application.damage-analysis.enabled=${DAMAGE_ANALYSIS_ENABLED:true}
# Fail-closed pilot mode: when true, only listed authenticated emails can analyze or generate reports.
application.damage-analysis.test-only=${DAMAGE_ANALYSIS_TEST_ONLY:false}
application.damage-analysis.test-emails=${DAMAGE_ANALYSIS_TEST_EMAILS:}
