name: Memory optimization checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "ai-service/**"
      - "Dockerfile"
      - "src/main/resources/application.properties"
      - "src/main/java/com/gorkem/vehicle_inspector/service/SubscriptionService.java"
      - "src/main/java/com/gorkem/vehicle_inspector/service/BillingService.java"
      - "src/main/java/com/gorkem/vehicle_inspector/service/AiAssistantEntitlementService.java"
      - "src/main/java/com/gorkem/vehicle_inspector/controller/AiAssistantController.java"
      - "src/main/java/com/gorkem/vehicle_inspector/entity/AiAssistantAccess.java"
      - "src/test/java/com/gorkem/vehicle_inspector/FreeAssistantEntitlementTest.java"
      - "src/test/java/com/gorkem/vehicle_inspector/SubscriptionServiceTest.java"
      - "mobile/lib/features/ai_assistant/**"
      - "mobile/lib/features/profile/**"
      - "mobile/lib/features/billing/**"
      - "src/main/java/com/gorkem/vehicle_inspector/service/report/**"
      - "src/main/java/com/gorkem/vehicle_inspector/dto/llm/**"
      - "src/test/java/com/gorkem/vehicle_inspector/service/report/**"
      - ".github/workflows/memory-optimization.yml"
  workflow_dispatch:

jobs:
  ai-memory-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight API test dependencies
        run: |
          python -m pip install "pip==26.2.2"
          python -m pip install "fastapi==0.139.2" "pydantic==2.13.4" "pypdf==6.19.0"
      - name: Compile Python modules
        run: python -m compileall -q ai-service/app ai-service/main.py ai-service/tests
      - name: Run AI service and assistant regression tests
        env:
          PYTHONPATH: ai-service
        run: python -m unittest discover -s ai-service/tests -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: chmod +x ./mvnw && ./mvnw -B test
