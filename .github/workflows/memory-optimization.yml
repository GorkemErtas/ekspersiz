name: Memory optimization checks

on:
  pull_request:
    paths:
      - "ai-service/**"
      - "Dockerfile"
      - "src/main/resources/application.properties"
      - ".github/workflows/memory-optimization.yml"
  workflow_dispatch:

jobs:
  ai-memory-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight API test dependencies
        run: python -m pip install "fastapi==0.139.2" "pydantic==2.13.4" "python-multipart==0.0.32"
      - name: Compile Python modules
        run: python -m compileall -q ai-service/app ai-service/main.py ai-service/tests
      - name: Run focused memory lifecycle tests
        env:
          PYTHONPATH: ai-service
        run: python -m unittest discover -s ai-service/tests -p "test_resource_lifecycle.py" -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: chmod +x ./mvnw && ./mvnw -B test

  real-inference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime dependencies
        run: |
          python -m pip install "torch==2.13.0+cpu" "torchvision==0.28.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "fastapi==0.139.2" "pydantic==2.13.4" "python-multipart==0.0.32" "numpy==2.5.1" "pillow==12.3.0" "ultralytics==8.4.106" "opencv-python-headless==4.13.0.92"
          python -m pip uninstall -y opencv-python || true
          python -m pip install --force-reinstall --no-deps "opencv-python-headless==4.13.0.92"
      - name: Benchmark uncapped Ultralytics CPU threads (comparison, not Railway baseline)
        env:
          PYTHONPATH: ai-service
          YOLO_CONFIG_DIR: /tmp/ultralytics
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "4"
          AI_TORCH_NUM_THREADS: "0"
        run: python ai-service/scripts/measure_runtime_memory.py | tee /tmp/ai-four-threads.log
      - name: Benchmark bounded two CPU threads with identical model weights
        env:
          PYTHONPATH: ai-service
          YOLO_CONFIG_DIR: /tmp/ultralytics
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          AI_TORCH_NUM_THREADS: "2"
        run: python ai-service/scripts/measure_runtime_memory.py | tee /tmp/ai-two-threads.log
      - name: Verify inference output equivalence; report RAM difference
        run: |
          python - <<'PY'
          import json
          def load(path):
              lines = open(path, encoding="utf-8").readlines()
              return json.loads(next(x.removeprefix("MEMORY_SMOKE_RESULT=") for x in lines if x.startswith("MEMORY_SMOKE_RESULT=")))
          baseline = load("/tmp/ai-four-threads.log")
          optimized = load("/tmp/ai-two-threads.log")
          print(f"Uncapped (actual {baseline['torch_cpu_threads']} threads): {baseline['peak_rss_mib']} MiB peak; two threads: {optimized['peak_rss_mib']} MiB peak")
          print(f"Uncapped cold image: {baseline['first_image_request_seconds']}s; two threads: {optimized['first_image_request_seconds']}s")
          for label, run in (("uncapped", baseline), ("two-threads", optimized)):
              print(f"{label}: RSS warm={run['rss_warm_mib']} MiB, after large images={run['rss_after_large_mib']} MiB, after GC={run['rss_after_gc_mib']} MiB, after malloc_trim={run['rss_after_trim_mib']} MiB")
          assert baseline["image_quality_code"] == optimized["image_quality_code"]
          assert baseline["large_quality_codes"] == optimized["large_quality_codes"]
          assert baseline["detections"] == optimized["detections"], "Model detections changed under thread cap"
          assert baseline["torch_cpu_threads"] >= 2
          assert optimized["torch_cpu_threads"] == 2
          PY
