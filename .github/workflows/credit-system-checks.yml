name: Credit system pre-merge checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/main/resources/db/migration/**"
      - "src/main/java/com/gorkem/vehicle_inspector/**"
      - "src/test/java/com/gorkem/vehicle_inspector/**"
      - "pom.xml"
      - ".github/workflows/credit-system-checks.yml"
  workflow_dispatch:

jobs:
  backend-credit-tests:
    name: Maven tests and PostgreSQL credit migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: credit_test
          POSTGRES_PASSWORD: credit_test
          POSTGRES_DB: credit_system_test
          # Local CI-only ephemeral container. Never use trust on production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U credit_test -d credit_system_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Create disposable persistence test databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: credit_test
        run: |
          createdb vehicle_inspector_test
          createdb security_audit_test
      - name: Run backend, security and isolated PostgreSQL persistence tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B '-Dtest=*Test,*IT' \
            -Dcredit.test.jdbc-url=jdbc:postgresql://127.0.0.1:5432/credit_system_test -Dcredit.test.username=credit_test \
            -Dinspection.test.jdbc-url=jdbc:postgresql://127.0.0.1:5432/vehicle_inspector_test -Dinspection.test.username=credit_test \
            -Dsecurity.test.jdbc-url=jdbc:postgresql://127.0.0.1:5432/security_audit_test -Dsecurity.test.username=credit_test test
