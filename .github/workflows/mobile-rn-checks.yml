name: React Native readiness checks

on:
  pull_request:
    paths:
      - "mobile-rn/**"
      - "contracts/**"
      - "src/main/java/com/gorkem/vehicle_inspector/dto/**"
      - ".github/workflows/mobile-rn-checks.yml"
      - ".github/workflows/mobile-ota-promote.yml"
      - ".gitattributes"
  push:
    branches: [master]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/mobile-rn-checks.yml"
      - ".github/workflows/mobile-ota-promote.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-rn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  EXPO_NO_DOTENV: "1"
  APP_VARIANT: development
  EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile-rn/.nvmrc
      - id: classify
        name: Classify all changed paths, including both sides of renames
        run: node mobile-rn/scripts/ota-classify.mjs
        env:
          OTA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          OTA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: ota-classification-${{ github.sha }}
          path: mobile-rn/.ota/classification.json
          include-hidden-files: true
          retention-days: 14

  compatibility:
    needs: [classify, checks]
    if: needs.classify.outputs.kind == 'ota'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile-rn/.nvmrc
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - run: npm ci
        working-directory: mobile-rn
      - run: npm ci
        working-directory: baseline/mobile-rn
      - name: Require equal native fingerprints for the base and candidate
        run: node mobile-rn/scripts/ota-fingerprint.mjs mobile-rn baseline/mobile-rn

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile-rn/.nvmrc
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run test:ci-scripts
      - name: Install the pinned EAS CLI for non-publishing integration checks
        run: npm install --global eas-cli@27.2.0
      - name: Verify the real CLI environment contract without network or publishing
        run: npm run test:ota-cli
      - name: Check compatibility against the locked Expo SDK's bundled versions
        run: npx expo install --check
        env:
          # New remote patch recommendations must not force dependency upgrades in a release fix.
          # The explicit install --check command still validates bundledNativeModules.json.
          EXPO_OFFLINE: "1"
      - run: npm run check:config
      - run: npm run audit:ci
      - name: Bundle both native JS entry points without store or AI credentials
        run: npx expo export --platform android --platform ios --source-maps --output-dir dist
      - run: node scripts/check-runtime-bundle.mjs dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-rn-audit
          path: mobile-rn/coverage/npm-audit.json
          retention-days: 14

  android:
    name: ${{ matrix.variant == 'debug' && 'android' || 'android-release' }}
    needs: [checks, classify]
    if: needs.classify.outputs.kind == 'native' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Release smoke includes R8, lint and three emulator cold starts; 60 minutes was insufficient.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      # Release smoke stays on .dev, uses no production inputs, and exercises R8/Hermes.
      ANDROID_RELEASE_OPTIMIZE: ${{ matrix.variant == 'release' && '1' || '0' }}
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Android native builds
        shell: bash
        run: |
          df -h /
          # This Android job does not use .NET, Haskell, Swift or CodeQL.
          # Preserve the Android SDK, Java, Node and all checkout files.
          for directory in /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL; do
            if [ -d "$directory" ]; then
              sudo rm -rf -- "$directory"
            fi
          done
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile-rn/.nvmrc
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          # Override v3's obsolete "tools platform-tools" default.
          packages: "platform-tools"
      - run: npm ci
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.31.6'
      - name: Generate development Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure Gradle memory for Android builds
        shell: bash
        run: |
          # Expo prebuild generates android/gradle.properties on each clean CI runner.
          # Replace the conservative template defaults (2 GiB heap / 512 MiB metaspace).
          sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.workers.max=/d; /^org.gradle.parallel=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
          grep -E '^(org.gradle.jvmargs|org.gradle.workers.max|org.gradle.parallel)=' android/gradle.properties
      - name: Compile native modules and assemble a development APK
        if: matrix.variant == 'debug'
        working-directory: mobile-rn/android
        run: ./gradlew :app:assembleDebug :app:lintDebug -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon
      - name: Compile optimized release smoke bundle and run release lint
        if: matrix.variant == 'release'
        working-directory: mobile-rn/android
        run: ./gradlew :app:bundleRelease :app:assembleRelease :app:lintRelease -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon
      - name: Check effective permissions after all native manifest merges
        if: matrix.variant == 'debug'
        run: node scripts/check-android-manifest.mjs
      - name: Verify release manifest, embedded Hermes, AAB signatures and native 16 KiB alignment
        if: matrix.variant == 'release'
        run: |
          node scripts/check-android-manifest.mjs android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml --release
          node scripts/check-android-r8.mjs
          java scripts/android/ReleaseIdentity.java inspect android/app/build/outputs/bundle/release/app-release.aab
      - name: Enable emulator KVM access on the ephemeral runner
        if: matrix.variant == 'release'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start optimized APK three times and require rendered React Native UI
        if: matrix.variant == 'release'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile-rn
          script: node scripts/android-cold-start.mjs emulator-5554 android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab com.gorkem.ekspersiz.dev 52 release-artifacts/cold-start-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.variant }}-lint
          path: |
            mobile-rn/android/app/build/reports/lint-results-*
            mobile-rn/release-artifacts/cold-start-ci/
          retention-days: 14

  staging:
    name: Publish validated Android update to staging
    needs: [classify, checks, compatibility]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.repository == 'GorkemErtas/ekspersiz' &&
      needs.classify.outputs.kind == 'ota' &&
      needs.checks.result == 'success' && needs.compatibility.result == 'success' &&
      vars.OTA_STAGING_ENABLED == 'true'
    environment: ota-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile-rn/.nvmrc
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - run: npm ci
      - name: Install the reviewed EAS CLI before exposing its token
        run: npm install --global eas-cli@27.2.0
      - name: Export, validate, and publish one production-environment snapshot
        run: eas env:exec production 'node scripts/ota-release.mjs staging' --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Preserve an audit result if EAS bootstrap failed
        if: always()
        run: node scripts/ota-audit.mjs staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-staging-${{ github.sha }}
          path: mobile-rn/.ota/reports/publication.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
