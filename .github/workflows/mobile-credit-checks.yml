name: Flutter credit release checks

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-credit-checks.yml"
  workflow_dispatch:

jobs:
  flutter-credit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space for Android native builds
        shell: bash
        run: |
          df -h /
          # This Android job does not use the runner's .NET, Haskell, Swift or CodeQL installations.
          # Keep the Android SDK, Java, Flutter and all checkout files.
          for directory in /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL; do
            if [ -d "$directory" ]; then
              sudo rm -rf -- "$directory"
            fi
          done
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run all widget and unit tests
        run: flutter test --no-pub
      - name: Build unsigned debug APK for Android native compilation smoke
        run: flutter build apk --debug --no-pub
