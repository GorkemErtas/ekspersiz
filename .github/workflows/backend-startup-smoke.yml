name: Backend JVM memory smoke

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "src/main/resources/application.properties"
      - ".github/workflows/backend-startup-smoke.yml"
  workflow_dispatch:

jobs:
  spring-with-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vehicle_inspector
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vehicle_inspector"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Spring Boot JAR
        run: chmod +x ./mvnw && ./mvnw -B package -DskipTests
      - name: Boot with candidate heap, migrate schema, check health and RSS
        env:
          JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
          DATABASE_URL: jdbc:postgresql://localhost:5432/vehicle_inspector
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_POOL_MAX_SIZE: "5"
          DB_POOL_MIN_IDLE: "1"
          JWT_SECRET: "ci-local-only-jwt-secret-at-least-32-characters"
          GEMINI_API_KEY: "ci-fake-no-external-calls"
          GOOGLE_PLACES_API_KEY: "ci-fake-no-external-calls"
          GOOGLE_AUTH_CLIENT_ID: "ci-fake.apps.googleusercontent.com"
          BREVO_API_KEY: "ci-fake-no-external-calls"
          BREVO_SENDER_EMAIL: "ci@example.invalid"
          FCM_ENABLED: "false"
          UPLOAD_DIR: /tmp/ekspersiz-uploads
        run: |
          set -eu
          java -jar target/*.jar >/tmp/ekspersiz-backend-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 75); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Backend exited during startup"
              tail -n 100 /tmp/ekspersiz-backend-ci.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Backend did not become healthy"
            tail -n 100 /tmp/ekspersiz-backend-ci.log
            exit 1
          fi
          echo "BACKEND_HEALTH=UP"
          grep -E "VmRSS|VmHWM" "/proc/$app_pid/status" || true
          jcmd "$app_pid" GC.heap_info || true
