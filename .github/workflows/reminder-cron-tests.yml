name: Reminder job regression tests

on:
  pull_request:
    paths:
      - "src/main/java/com/gorkem/vehicle_inspector/controller/InternalReminderJobController.java"
      - "src/main/java/com/gorkem/vehicle_inspector/config/SecurityConfig.java"
      - "src/main/resources/application.properties"
      - "src/test/java/com/gorkem/vehicle_inspector/InternalReminderJobControllerTest.java"
      - ".github/workflows/reminder-cron-tests.yml"
  workflow_dispatch:

jobs:
  reminder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run reminder controller and scheduler tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B -Dtest=InternalReminderJobControllerTest,ReminderNotificationSchedulerTest test
