source_dataset: CarDD
source_names:
  0: dent
  1: scratch
  2: crack
  3: glass shatter
  4: lamp broken
  5: tire flat

# This is the output head for the CarDD Detection V2 experiment. These names
# must remain a unique subset of the application taxonomy in damage_taxonomy.yaml.
model_classes:
  0: SCRATCH
  1: DENT
  2: CRACK
  3: BROKEN_PART
  4: BROKEN_GLASS

# Targets are canonical application class names. Their model IDs are resolved
# through model_classes above. A null target follows the explicit drop policy.
class_mapping:
  0: DENT
  1: SCRATCH
  2: CRACK
  3: BROKEN_GLASS
  4: BROKEN_PART
  5: null

drop_policy:
  5: quarantine_if_only_annotation
