source_dataset: CarDD
source_names:
  0: dent
  1: scratch
  2: crack
  3: glass shatter
  4: lamp broken
  5: tire flat

# Targets are resolved against config/damage_taxonomy.yaml. A null target means
# that the annotation is unsupported and must follow the explicit drop policy.
class_mapping:
  0: DENT
  1: SCRATCH
  2: CRACK
  3: BROKEN_GLASS
  4: BROKEN_PART
  5: null

drop_policy:
  5: quarantine_if_only_annotation
